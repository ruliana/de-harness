<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Diagram Studio</title>
<link rel="stylesheet" href="/studio.css">
</head>
<body>
<!-- Gradients that the drawing refers to (`fill: url(#g-actor)`): in the page, not in the drawing, which Mermaid renders again for every change. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-actor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="g-node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f6ff"/></linearGradient>
    <linearGradient id="g-choice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient>
  </defs>
</svg>
<header>
  <span class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7 6h10M6.2 8l4.6 8M17.8 8l-4.6 8"/></svg></span>
  <span class="title">Diagram Studio</span>
  <span class="sub">diagrams from Mermaid text</span>
  <span id="kind" class="pill"></span>
</header>
<div id="canvas"></div>
<div id="ghosts"></div>
<div id="source"><div class="bar"><i></i><i></i><i></i><b>diagram.mmd</b></div><div class="body"><code></code></div></div>
<script src="/mermaid.js"></script>
<script src="/studio.js"></script>
</body>
</html>
