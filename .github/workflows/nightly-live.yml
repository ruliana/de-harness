name: nightly-live
# Catches model drift by re-running the acceptance tests against live Jev. Never blocks merges.
# Needs a repository secret named TYPESAFE_API_KEY; without it the job is skipped.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
jobs:
  live:
    if: ${{ vars.HAS_TYPESAFE_KEY == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Headless Chromium for the browser tests. The browser version follows the pinned playwright, so the cache key is the lockfile.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - run: npm run test:live
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
