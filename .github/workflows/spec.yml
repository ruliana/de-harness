name: spec
# The behaviour spec (tests/spec) fails on purpose until the agent is fixed, so this job reports and never blocks:
# it is not one of the required checks of the Premerge ruleset (typecheck, acceptance).
on:
  pull_request:
  push:
    branches: [main]
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Replay mode: Jev answered from tests/cassettes/spec. continue-on-error: known gaps must not turn the PR red.
      - run: npm run test:spec
        continue-on-error: true
