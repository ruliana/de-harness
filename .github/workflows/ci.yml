name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Headless Chromium for the browser tests. The browser version follows the pinned playwright, so the cache key is the lockfile.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      # Replay mode: Jev and external HTTP come from committed cassettes. No API key, no network.
      - run: npm test
